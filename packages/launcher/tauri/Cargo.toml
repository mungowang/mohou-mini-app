[package]
name = "mini-app-window"
version = "1.0.38"
edition = "2021"
description = "Mohou panel window (launcher). Loads the loopback origin; not part of @mohou/shell."
publish = false

[dependencies]
serde_json = "1"
tauri = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { version = "0.3", features = ["iterator"] }

[build-dependencies]
tauri-build = "2"
